[package]
name = "vleue_kinetoscope"
version = "0.5.0"
edition = "2024"
exclude = ["animated-gif.webp", "assets/big-buck-bunny.webp"]
authors = ["François Mockers <francois.mockers@vleue.com>"]
description = "Animated GIF player for Bevy"
repository = "https://github.com/vleue/vleue_kinetoscope"
homepage = "https://github.com/vleue/vleue_kinetoscope"
documentation = "https://docs.rs/vleue_kinetoscope"
keywords = ["bevy", "animation", "gif"]
license = "MIT OR Apache-2.0"
readme = "README.md"
categories = ["game-development"]

[features]
default = ["gif", "webp", "streaming"]
gif = ["image/gif"]
webp = ["image/webp"]
streaming = ["bevy_tasks/multi_threaded"]

[dependencies]
image = { version = "0.25", default-features = false }
thiserror = "1.0"
smallvec = "1.15"
log = "0.4"
crossbeam-channel = "0.5"
bevy_ecs = { rev = "d06aa47744dfa378f2e8a31cd7ff2d59c9afe4b9", git = "https://github.com/bevyengine/bevy", default-features = false }
bevy_app = { rev = "d06aa47744dfa378f2e8a31cd7ff2d59c9afe4b9", git = "https://github.com/bevyengine/bevy", default-features = false }
bevy_asset = { rev = "d06aa47744dfa378f2e8a31cd7ff2d59c9afe4b9", git = "https://github.com/bevyengine/bevy", default-features = false }
bevy_image = { rev = "d06aa47744dfa378f2e8a31cd7ff2d59c9afe4b9", git = "https://github.com/bevyengine/bevy", default-features = false }
bevy_reflect = { rev = "d06aa47744dfa378f2e8a31cd7ff2d59c9afe4b9", git = "https://github.com/bevyengine/bevy", default-features = false }
bevy_tasks = { rev = "d06aa47744dfa378f2e8a31cd7ff2d59c9afe4b9", git = "https://github.com/bevyengine/bevy", default-features = false, optional = true }
bevy_time = { rev = "d06aa47744dfa378f2e8a31cd7ff2d59c9afe4b9", git = "https://github.com/bevyengine/bevy", default-features = false }
bevy_sprite = { rev = "d06aa47744dfa378f2e8a31cd7ff2d59c9afe4b9", git = "https://github.com/bevyengine/bevy", default-features = false }


[dev-dependencies]
bevy = { rev = "d06aa47744dfa378f2e8a31cd7ff2d59c9afe4b9", git = "https://github.com/bevyengine/bevy" }
